name: Build and Release APK

on:
  push:
    branches: [ main, 'repair/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.4
            chmod +x gradlew
          fi

      - name: Build Debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -f gradlew ]; then
            ./gradlew testDebugUnitTest assembleDebug --stacktrace
          else
            gradle testDebugUnitTest assembleDebug --stacktrace
          fi

      - name: Validate APK
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "=== Validando APK: $APK ==="
          ls -lh "$APK"

          SIZE=$(stat -c%s "$APK")
          echo "Tamaño: $SIZE bytes"
          if [ "$SIZE" -lt 500000 ]; then
            echo "ERROR: APK demasiado pequeño (< 500 KB)."
            exit 1
          fi

          unzip -t "$APK" > /dev/null || { echo "ERROR: No es un ZIP válido"; exit 1; }

          LIST=$(unzip -l "$APK")
          echo "$LIST" | grep -q "AndroidManifest.xml" || { echo "ERROR: Falta AndroidManifest.xml"; exit 1; }
          echo "$LIST" | grep -q "classes.dex" || { echo "ERROR: Falta classes.dex"; exit 1; }
          echo "$LIST" | grep -q "resources.arsc" || { echo "ERROR: Falta resources.arsc"; exit 1; }

          echo "=== APK válido ==="
          echo "$LIST" | head -30

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kuntur-Media-Pro-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success() && github.ref == 'refs/heads/main'
        with:
          tag_name: v2.9.${{ github.run_number }}
          name: Kuntur Media Pro v2.9.${{ github.run_number }}
          body: |
            APK Kuntur Media Pro (debug).
            - Control de brillo por lados
            - Pantalla completa con rotación
            - Reproducción sin pausa en llamadas
            - Traductor de voz
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
