name: Build and Release APK

on:
  push:
    branches: [ main, 'repair/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Write local.properties placeholders
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties || true

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Build Debug APK (with retry)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g"
        run: |
          set -o pipefail
          build_once() {
            if [ -x ./gradlew ]; then
              ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build.log
            else
              gradle assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build.log
            fi
          }
          if ! build_once; then
            echo "=== Primer intento falló; reintentando en 15s ==="
            sleep 15
            build_once
          fi

      - name: Show build errors on failure
        if: failure()
        run: |
          echo "=== ERRORES ==="
          if [ -f build.log ]; then
            grep -E "error:|e: |FAILED|Exception|What went wrong|Could not resolve|Unresolved" build.log | head -100 || true
            echo "=== TAIL ==="
            tail -100 build.log
          fi

      - name: Validate and package APK
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)
          if [ -z "${APK:-}" ]; then
            echo "ERROR: No se generó ningún APK."
            find app/build -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          echo "APK: $APK ($SIZE bytes)"
          test "$SIZE" -ge 500000
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q "AndroidManifest.xml"
          unzip -l "$APK" | grep -q "classes.dex"
          unzip -l "$APK" | grep -q "resources.arsc"
          mkdir -p dist
          cp "$APK" dist/Kuntur-Media-Pro.apk
          (cd dist && zip -9 -j Kuntur-Media-Pro.zip Kuntur-Media-Pro.apk)
          ls -lh dist/
          echo "APK válido"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kuntur-Media-Pro-debug
          path: |
            dist/Kuntur-Media-Pro.apk
            dist/Kuntur-Media-Pro.zip
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success() && github.ref == 'refs/heads/main'
        with:
          tag_name: v2.9.${{ github.run_number }}
          name: Kuntur Media Pro v2.9.${{ github.run_number }}
          body: |
            ## Instalación
            1. Descargue **Kuntur-Media-Pro.zip**
            2. Extraiga `Kuntur-Media-Pro.apk`
            3. Desinstale la versión anterior
            4. Instale el APK

            No envíe el APK por WhatsApp (se corrompe).
          files: |
            dist/Kuntur-Media-Pro.apk
            dist/Kuntur-Media-Pro.zip
          draft: false
          prerelease: false
