name: Build and Release APK

on:
  push:
    branches: [ main, 'repair/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.4
            chmod +x gradlew
          fi

      - name: Build Debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
          else
            gradle assembleDebug --stacktrace 2>&1 | tee build.log
          fi

      - name: Show build errors on failure
        if: failure()
        run: |
          echo "=== ERRORES DE COMPILACIÓN ==="
          if [ -f build.log ]; then
            grep -E "error:|e: |FAILED|Exception|What went wrong" build.log | head -80 || true
            tail -100 build.log
          fi

      - name: Validate and package APK
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No se generó ningún APK."
            ls -laR app/build/outputs || true
            exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          echo "APK: $APK ($SIZE bytes)"
          if [ "$SIZE" -lt 500000 ]; then
            echo "ERROR: APK demasiado pequeño"
            exit 1
          fi
          # Magic ZIP
          HEADER=$(od -An -tx1 -N4 "$APK" | tr -d ' \n')
          echo "Header: $HEADER"
          echo "$HEADER" | grep -q "504b0304" || { echo "ERROR: no es ZIP/APK"; exit 1; }
          unzip -t "$APK" >/dev/null
          LIST=$(unzip -l "$APK")
          echo "$LIST" | grep -q "AndroidManifest.xml"
          echo "$LIST" | grep -q "classes.dex"
          echo "$LIST" | grep -q "resources.arsc"

          mkdir -p dist
          cp "$APK" dist/Kuntur-Media-Pro.apk
          # ZIP para transferencia segura (WhatsApp no corrompe el .zip igual)
          (cd dist && zip -9 Kuntur-Media-Pro.zip Kuntur-Media-Pro.apk)
          ls -lh dist/
          echo "=== APK válido y empaquetado ==="

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kuntur-Media-Pro-debug
          path: |
            dist/Kuntur-Media-Pro.apk
            dist/Kuntur-Media-Pro.zip
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success() && github.ref == 'refs/heads/main'
        with:
          tag_name: v2.9.${{ github.run_number }}
          name: Kuntur Media Pro v2.9.${{ github.run_number }}
          body: |
            ## Instalación
            1. Descargue **Kuntur-Media-Pro.zip** (recomendado) o el APK directo.
            2. Si descargó el ZIP: ábralo y extraiga `Kuntur-Media-Pro.apk`.
            3. En el teléfono: permita instalar apps de fuentes desconocidas.
            4. Desinstale la versión anterior e instale este APK.

            **No envíe el APK por WhatsApp** (se corrompe). Use el ZIP o descargue desde GitHub.
          files: |
            dist/Kuntur-Media-Pro.apk
            dist/Kuntur-Media-Pro.zip
          draft: false
          prerelease: false
