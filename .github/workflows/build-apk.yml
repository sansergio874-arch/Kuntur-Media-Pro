name: Build and Release APK

on:
  push:
    branches: [ main, 'repair/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.4 || true
            chmod +x gradlew 2>/dev/null || true
          fi
          ls -la gradlew gradle/wrapper/ || true

      - name: Build Debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          if [ -x ./gradlew ]; then
            ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
          else
            gradle assembleDebug --stacktrace 2>&1 | tee build.log
          fi

      - name: Show build errors on failure
        if: failure()
        run: |
          echo "=== ERRORES ==="
          if [ -f build.log ]; then
            grep -E "error:|e: |FAILED|Exception|What went wrong" build.log | head -80 || true
            tail -80 build.log
          fi

      - name: Validate and package APK
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)
          if [ -z "${APK:-}" ]; then
            echo "ERROR: No se generó ningún APK."
            find app/build -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          echo "APK: $APK ($SIZE bytes)"
          test "$SIZE" -ge 500000
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q "AndroidManifest.xml"
          unzip -l "$APK" | grep -q "classes.dex"
          unzip -l "$APK" | grep -q "resources.arsc"
          mkdir -p dist
          cp "$APK" dist/Kuntur-Media-Pro.apk
          (cd dist && zip -9 -j Kuntur-Media-Pro.zip Kuntur-Media-Pro.apk)
          ls -lh dist/
          echo "APK válido"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kuntur-Media-Pro-debug
          path: |
            dist/Kuntur-Media-Pro.apk
            dist/Kuntur-Media-Pro.zip
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success() && github.ref == 'refs/heads/main'
        with:
          tag_name: v2.9.${{ github.run_number }}
          name: Kuntur Media Pro v2.9.${{ github.run_number }}
          body: |
            ## Instalación correcta (evita INSTALL_PARSE_FAILED_NOT_APK)
            1. Descargue **Kuntur-Media-Pro.zip** desde este release.
            2. Extraiga el archivo `Kuntur-Media-Pro.apk`.
            3. Desinstale la versión anterior de la app.
            4. Instale el APK (permita fuentes desconocidas).

            No envíe el APK por WhatsApp: se corrompe. Use el ZIP o descargue directo en el teléfono desde GitHub.
          files: |
            dist/Kuntur-Media-Pro.apk
            dist/Kuntur-Media-Pro.zip
          draft: false
          prerelease: false
