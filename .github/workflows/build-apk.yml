name: Build and Release APK

on:
  push:
    branches: [ main, 'repair/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.4
            chmod +x gradlew
          fi

      - name: Build Debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
          else
            gradle assembleDebug --stacktrace 2>&1 | tee build.log
          fi
          echo "Build exit code: $?"

      - name: Show build errors on failure
        if: failure()
        run: |
          echo "=== ERRORES DE COMPILACIÓN ==="
          if [ -f build.log ]; then
            grep -E "error:|e: |FAILED|Exception|What went wrong" build.log | head -80 || echo "No se encontraron líneas de error específicas"
            echo "=== Últimas 100 líneas del log ==="
            tail -100 build.log
          else
            echo "No hay build.log"
          fi

      - name: Validate APK
        run: |
          set -euo pipefail
          if [ ! -d app/build/outputs/apk/debug ]; then
            echo "ERROR: Directorio de APK no existe. El build falló."
            exit 1
          fi
          APK=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No se generó ningún APK."
            ls -la app/build/outputs/apk/debug/ || true
            exit 1
          fi
          echo "=== Validando APK: $APK ==="
          ls -lh "$APK"

          SIZE=$(stat -c%s "$APK")
          echo "Tamaño: $SIZE bytes"
          if [ "$SIZE" -lt 500000 ]; then
            echo "ERROR: APK demasiado pequeño (< 500 KB)."
            exit 1
          fi

          unzip -t "$APK" > /dev/null || { echo "ERROR: No es un ZIP válido"; exit 1; }

          LIST=$(unzip -l "$APK")
          echo "$LIST" | grep -q "AndroidManifest.xml" || { echo "ERROR: Falta AndroidManifest.xml"; exit 1; }
          echo "$LIST" | grep -q "classes.dex" || { echo "ERROR: Falta classes.dex"; exit 1; }
          echo "$LIST" | grep -q "resources.arsc" || { echo "ERROR: Falta resources.arsc"; exit 1; }

          echo "=== APK válido ==="
          echo "$LIST" | head -30

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kuntur-Media-Pro-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success() && github.ref == 'refs/heads/main'
        with:
          tag_name: v2.9.${{ github.run_number }}
          name: Kuntur Media Pro v2.9.${{ github.run_number }}
          body: |
            APK Kuntur Media Pro (debug).
            - Reproductor simplificado
            - Pantalla completa con rotación
            - Calidades de video
            - Traductor de voz
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
